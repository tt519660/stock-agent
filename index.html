<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #e9ebee;
    background-image: linear-gradient(180deg, #eceeef 0%, #e3e6ea 100%);
    background-attachment: fixed;
    color: #33383f;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 卡片通用 ── */
  .input-card, .step-card, .final-card, .status-bar {
    box-shadow: 0 1px 2px rgba(30, 35, 45, 0.05), 0 1px 3px rgba(30, 35, 45, 0.04);
  }

  /* ── 顶部 ── */
  header {
    background: rgba(234, 236, 239, 0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #d8dbdf;
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 17px; font-weight: 650; color: #2b3037; letter-spacing: -0.01em; }
  header h1::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #5c68d8;
    margin-right: 10px;
    vertical-align: 2px;
  }
  header .subtitle { font-size: 12px; color: #8b9099; margin-top: 3px; }

  /* ── 主体布局 ── */
  .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

  /* ── 输入区 ── */
  .input-card {
    background: #f2f3f5;
    border: 1px solid #dde0e5;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .mode-toggle {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    align-items: center;
    background: #e4e6ea;
    border-radius: 8px;
    width: max-content;
    padding: 3px;
  }
  .mode-toggle > span { padding: 0 2px 0 8px; }
  .mode-btn {
    padding: 5px 14px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: #6d737c;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .mode-btn.active {
    background: #f9fafa;
    box-shadow: 0 1px 2px rgba(30, 35, 45, 0.09);
    color: #33383f;
    font-weight: 500;
  }
  .input-row {
    display: flex;
    gap: 10px;
  }
  textarea {
    flex: 1;
    background: #e8eaee;
    border: 1px solid #d8dbdf;
    border-radius: 8px;
    color: #33383f;
    padding: 10px 14px;
    font-size: 14px;
    resize: vertical;
    min-height: 72px;
    outline: none;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  textarea::placeholder { color: #9aa0a8; }
  textarea:focus {
    border-color: #aab3e2;
    background: #f2f3f5;
    box-shadow: 0 0 0 3px rgba(92, 104, 216, 0.09);
  }
  .send-btn {
    padding: 0 24px;
    background: #5c68d8;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .send-btn:hover:not(:disabled) { background: #4d58c8; }
  .send-btn:disabled { background: #c3c7cd; cursor: not-allowed; }
  .send-btn.running {
    background: #e5534b;
    animation: runningPulse 1.6s ease-in-out infinite;
  }
  .send-btn.running:hover { background: #d6423a; }
  @keyframes runningPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.75; }
  }

  /* ── 示例问题 ── */
  .examples { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
  .example-chip {
    background: #e8eaee;
    border: 1px solid #d8dbdf;
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 12px;
    color: #6d737c;
    cursor: pointer;
    transition: all 0.15s;
  }
  .example-chip:hover {
    border-color: #aab3e2;
    background: #e7e8f4;
    color: #4d58c8;
  }

  /* ── 状态栏 ── */
  .status-bar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: #f2f3f5;
    border: 1px solid #dde0e5;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 13px;
    color: #6d737c;
  }
  .status-bar.visible { display: flex; }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid #d8dbdf;
    border-top-color: #5c68d8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 步骤卡片 ── */
  .steps-container { display: flex; flex-direction: column; gap: 12px; }

  .step-card {
    background: #f2f3f5;
    border: 1px solid #dde0e5;
    border-radius: 10px;
    overflow: hidden;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

  .step-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid #e5e7ea;
  }
  .step-badge {
    background: #e2e5e9;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 11px;
    color: #6d737c;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .step-title {
    font-size: 13.5px;
    font-weight: 500;
    flex: 1;
    font-family: monospace;
    color: #4a5058;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .step-toggle { color: #8b9099; font-size: 12px; flex-shrink: 0; }

  .step-body { padding: 14px 16px 4px; }

  /* 各区块颜色 */
  .thought-block, .action-block, .obs-block, .final-block {
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 10px;
  }
  .thought-block  { background: #e3eaf3; border-left: 3px solid #9bb8dc; }
  .action-block   { background: #f0eada; border-left: 3px solid #d6bd84; }
  .obs-block      { background: #e5eee5; border-left: 3px solid #97c29a; }
  .final-block    { background: #e8e9f6; border-left: 3px solid #aab2e6; }

  .block-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .thought-block  .block-label { color: #47608e; }
  .action-block   .block-label { color: #86703c; }
  .obs-block      .block-label { color: #4c7a51; }
  .final-block    .block-label { color: #4a55bb; }

  .block-content {
    font-size: 13px;
    line-height: 1.65;
    color: #4a5058;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .obs-block .block-content {
    max-height: 220px;
    overflow-y: auto;
    background: rgba(248, 249, 250, 0.7);
    border-radius: 6px;
    padding: 6px 10px;
    scrollbar-width: thin;
    scrollbar-color: #c8ccd2 transparent;
  }

  .tool-pill {
    display: inline-block;
    background: #eeeef9;
    border: 1px solid #c5caf0;
    border-radius: 6px;
    padding: 1px 10px;
    font-size: 12px;
    color: #4a55bb;
    font-family: monospace;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .args-code {
    background: rgba(248, 249, 250, 0.7);
    border: 1px solid rgba(214, 189, 132, 0.3);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: monospace;
    font-size: 12px;
    color: #7d7566;
    margin-top: 4px;
  }

  /* ── 最终答案卡 ── */
  .final-card {
    background: #f2f3f5;
    border: 1px solid #c5caf0;
    border-top: 3px solid #5c68d8;
    border-radius: 10px;
    padding: 20px;
    margin-top: 4px;
    animation: fadeIn 0.3s ease;
  }
  .final-card h3 { color: #4a55bb; font-size: 13px; margin-bottom: 10px; letter-spacing: 0.04em; }
  .final-card .answer-text {
    font-size: 14.5px;
    line-height: 1.8;
    color: #2b3037;
    white-space: pre-wrap;
  }
  .meta-row {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #e5e7ea;
    font-size: 12px;
    color: #8b9099;
    display: flex;
    gap: 16px;
  }

  /* ── 研报导出按钮 ── */
  .report-btn {
    display: inline-block;
    margin-top: 14px;
    padding: 6px 16px;
    background: #5c68d8;
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.15s;
  }
  .report-btn:hover { background: #4d58c8; }

  /* ── FC 版 Thought 提示 ── */
  .fc-thought-note {
    font-size: 12px;
    color: #8b9099;
    font-style: italic;
  }

  /* ── 折叠状态 ── */
  .step-body.collapsed { display: none; }
  .step-toggle.open::before { content: "▲"; }
  .step-toggle:not(.open)::before { content: "▼"; }

  /* ── 思考过程抽屉（DeepSeek 风格）── */
  .think-drawer {
    background: #f2f3f5;
    border: 1px solid #dde0e5;
    border-radius: 10px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(30, 35, 45, 0.04), 0 1px 3px rgba(30, 35, 45, 0.03);
    overflow: hidden;
    animation: fadeIn 0.3s ease;
  }
  .think-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 16px;
    cursor: pointer;
    user-select: none;
    color: #4a5058;
    font-size: 13px;
    transition: background 0.15s;
  }
  .think-header:hover { background: #edeef1; }
  .think-drawer .caret { color: #8b9099; font-size: 11px; display: inline-block; width: 12px; }
  .think-drawer .caret::before { content: "▸"; display: inline-block; transition: transform 0.2s; }
  .think-drawer.open .caret::before { content: "▾"; }
  .think-title { font-weight: 500; }
  .think-meta { margin-left: auto; font-size: 12px; color: #8b9099; }
  .think-body {
    max-height: 0;
    overflow-y: hidden;
    border-top: 1px solid transparent;
    transition: max-height 0.4s ease, border-color 0.3s;
  }
  .think-drawer.open .think-body {
    max-height: 20000px;
    overflow-y: auto;
    border-top-color: #e5e7ea;
  }
  .think-body .steps-container { padding: 12px; gap: 10px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>⚡ Financial Agent</h1>
    <div class="subtitle">Thought → Action → Observation 循环演示 | 数据来源：A股年报 + AkShare</div>
  </div>
</header>

<div class="container">

  <!-- 输入区 -->
  <div class="input-card">
    <div class="mode-toggle">
      <span style="font-size:13px;color:#64748b;margin-right:4px;">实现方式：</span>
      <button class="mode-btn active" data-mode="manual" onclick="setMode('manual',this)">
        手写 Prompt 解析
      </button>
      <button class="mode-btn" data-mode="fc" onclick="setMode('fc',this)">
        Function Calling
      </button>
    </div>
    <div class="input-row">
      <textarea id="question" placeholder="输入问题，例如：贵州茅台和五粮液2023年的毛利率哪家更高？"></textarea>
      <button class="send-btn" id="sendBtn" onclick="onSendOrStopClick()">发 送</button>
    </div>
    <div class="examples">
      <span style="font-size:12px;color:#475569;margin-right:4px;">示例：</span>
      <span class="example-chip" onclick="setQuestion(this.textContent)">茅台和五粮液2023年毛利率差多少个百分点？</span>
      <span class="example-chip" onclick="setQuestion(this.textContent)">宁德时代2021-2023年营收复合增长率是多少？</span>
      <span class="example-chip" onclick="setQuestion(this.textContent)">贵州茅台过去一年（2023年全年）股价涨跌幅？</span>
      <span class="example-chip" onclick="setQuestion(this.textContent)">海康威视2023年年报提到了哪些主要风险？</span>
      <span class="example-chip" onclick="setQuestion(this.textContent)" title="边界演示">预测明年A股市场走势 ⚠️</span>
    </div>
  </div>

  <!-- 状态栏 -->
  <div class="status-bar" id="statusBar">
    <div class="spinner"></div>
    <span id="statusText">正在思考...</span>
  </div>

  <!-- 思考过程抽屉（分析中出现，结束后默认收起） -->
  <div class="think-drawer" id="thinkDrawer" hidden>
    <div class="think-header" id="thinkHeader">
      <span class="caret"></span>
      <span class="think-title">💭 思考与调用过程</span>
      <span class="think-meta" id="thinkMeta">思考中…</span>
    </div>
    <div class="think-body">
      <div class="steps-container" id="stepsContainer"></div>
    </div>
  </div>

  <!-- 每轮最终结果（Final Answer / 错误） -->
  <div class="steps-container" id="resultArea"></div>

</div>

<script>
  let currentMode = 'manual';
  let isRunning   = false;
  let currentQueryId = null;
  let currentAbort   = null;

  function setMode(mode, btn) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function setQuestion(text) {
    document.getElementById('question').value = text;
  }

  function setStatus(text, visible) {
    const bar = document.getElementById('statusBar');
    document.getElementById('statusText').textContent = text;
    bar.classList.toggle('visible', visible);
  }

  function setSendEnabled(enabled) {
    const btn = document.getElementById('sendBtn');
    if (enabled) {
      btn.textContent = '发 送';
      btn.classList.remove('running');
      isRunning = false;
    } else {
      // 运行中按钮保持可点，变为"停止"
      btn.textContent = '⏹ 停止';
      btn.classList.add('running');
      isRunning = true;
    }
  }

  // 停止：通知服务端协作式取消 + 断开 SSE 流
  async function doStop() {
    try {
      if (currentQueryId) {
        await fetch(`/cancel/${currentQueryId}`, { method: 'POST' });
      }
    } catch { /* 服务端不可达时也照样断流 */ }
    if (currentAbort) currentAbort.abort();
  }

  function onSendOrStopClick() {
    if (isRunning) doStop(); else sendQuery();
  }

  // ── 思考抽屉控制 ──────────────────────────────────────────────────────────
  function setDrawer(open) {
    document.getElementById('thinkDrawer').classList.toggle('open', open);
  }
  function setDrawerMeta(text) {
    document.getElementById('thinkMeta').textContent = text;
  }
  function resetDrawerForNewQuery() {
    const drawer = document.getElementById('thinkDrawer');
    drawer.hidden = false;
    drawer.classList.add('open');
    document.getElementById('stepsContainer').innerHTML = '';
    setDrawerMeta('思考中…');
  }

  // ── 创建步骤卡片 ──────────────────────────────────────────────────────────
  function createStepCard(stepData) {
    const card = document.createElement('div');
    card.className = 'step-card';

    const isManual = (currentMode === 'manual');

    // 标题（Step 徽章带耗时）
    const header = document.createElement('div');
    header.className = 'step-header';
    const dur = stepData.duration_s != null ? ` · ${stepData.duration_s}s` : '';
    header.innerHTML = `
      <span class="step-badge">Step ${stepData.step}${dur}</span>
      <span class="step-title">🔧 ${stepData.action}(${JSON.stringify(stepData.action_input||{})})</span>
      <span class="step-toggle open"></span>
    `;

    const body = document.createElement('div');
    body.className = 'step-body';

    // Thought 块
    if (isManual && stepData.thought) {
      body.innerHTML += `
        <div class="thought-block">
          <div class="block-label">Thought</div>
          <div class="block-content">${esc(stepData.thought)}</div>
        </div>`;
    } else if (!isManual) {
      body.innerHTML += `
        <div class="thought-block">
          <div class="block-label">Thought</div>
          <div class="fc-thought-note">Function Calling 版：模型内部推理，不可见</div>
        </div>`;
    }

    // Action 块
    body.innerHTML += `
      <div class="action-block">
        <div class="block-label">Action</div>
        <span class="tool-pill">${esc(stepData.action)}</span>
        <div class="args-code">${esc(JSON.stringify(stepData.action_input||{}, null, 2))}</div>
      </div>`;

    // Observation 块
    body.innerHTML += `
      <div class="obs-block">
        <div class="block-label">Observation</div>
        <div class="block-content">${esc((stepData.observation||'').replace(/\n{3,}/g, '\n\n').trim())}</div>
      </div>`;

    // 折叠逻辑
    header.addEventListener('click', () => {
      body.classList.toggle('collapsed');
      header.querySelector('.step-toggle').classList.toggle('open');
    });

    card.appendChild(header);
    card.appendChild(body);
    return card;
  }

  function createFinalCard(stepData, totalSteps, elapsedS) {
    const card = document.createElement('div');
    card.className = 'final-card';
    card.innerHTML = `
      <h3>✅ Final Answer</h3>
      <div class="answer-text">${esc(stepData.answer)}</div>
      <div class="meta-row">
        <span>共 ${totalSteps} 步</span>
        <span>耗时 ~${elapsedS}s</span>
        <span>实现：${ currentMode === 'manual' ? '手写Prompt解析' : 'Function Calling' }</span>
      </div>`;
    return card;
  }

  function createErrorCard(msg) {
    const card = document.createElement('div');
    card.className = 'final-card';
    card.style.borderColor = '#fecaca';
    card.style.borderTop = '3px solid #ef4444';
    card.innerHTML = `<h3 style="color:#dc2626">⚠️ ${esc(msg)}</h3>`;
    return card;
  }

  function createNoticeCard(msg) {
    const card = document.createElement('div');
    card.className = 'final-card';
    card.innerHTML = `<h3 style="color:#6d737c">${esc(msg)}</h3>`;
    return card;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── 主发送逻辑 ────────────────────────────────────────────────────────────
  async function sendQuery() {
    if (isRunning) return;
    const question = document.getElementById('question').value.trim();
    if (!question) return;

    // 清空上次结果，重建思考抽屉（DeepSeek 风格 A：运行中默认展开）
    let finalCardEl = null;
    resetDrawerForNewQuery();
    document.getElementById('resultArea').innerHTML = '';
    setSendEnabled(false);
    setStatus('正在连接...', true);

    const endpoint = `/query/${currentMode}`;
    const startTime = Date.now();
    let actionStepCount = 0;

    try {
      currentQueryId = null;
      currentAbort = new AbortController();
      const resp = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, max_steps: 10 }),
        signal: currentAbort.signal,
      });

      if (!resp.ok) {
        throw new Error(`HTTP ${resp.status}`);
      }

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let   buffer  = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();   // 保留未完成的行

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let data;
          try { data = JSON.parse(line.slice(6)); } catch { continue; }

          if (data.type === 'start') {
            currentQueryId = data.query_id || null;
            setStatus(`🧠 思考中... (${currentMode === 'manual' ? '手写Prompt解析' : 'Function Calling'})`, true);

          } else if (data.type === 'action') {
            actionStepCount++;
            setStatus(`Step ${data.step}：正在调用 ${data.action}...`, true);
            setDrawerMeta(`${actionStepCount} 步 · ${data.action}`);
            const card = createStepCard(data);
            document.getElementById('stepsContainer').appendChild(card);
            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

          } else if (data.type === 'final') {
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            // 折叠思考抽屉，meta 汇总，主界面只剩结果
            setDrawer(false);
            setDrawerMeta(`${actionStepCount} 步 · ${elapsed} 秒`);
            const card = createFinalCard(data, actionStepCount, elapsed);
            document.getElementById('resultArea').appendChild(card);
            finalCardEl = card;
            card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            setStatus('完成', false);

          } else if (data.type === 'report') {
            if (finalCardEl && data.file) {
              const link = document.createElement('a');
              link.href = '/report/' + encodeURIComponent(data.file);
              link.className = 'report-btn';
              link.textContent = '📄 导出研报 (Markdown)';
              finalCardEl.appendChild(link);
            }

          } else if (data.type === 'stopped') {
            setDrawer(false);
            setDrawerMeta(`${actionStepCount} 步 · 已手动停止`);
            document.getElementById('resultArea').appendChild(createNoticeCard('⏹ 已手动停止，部分中间结果可在思考抽屉查看'));
            setStatus('', false);

          } else if (data.type === 'max_steps' || data.type === 'error') {
            setDrawer(false);
            setDrawerMeta(actionStepCount ? `${actionStepCount} 步 · 已中断` : '已中断');
            const card = createErrorCard(data.answer || data.observation || '未知错误');
            document.getElementById('resultArea').appendChild(card);
            setStatus('', false);

          } else if (data.type === 'done') {
            setStatus('', false);
          }
        }
      }
    } catch (err) {
      if (err.name === 'AbortError') {
        // 用户主动停止：断流所致，服务端已级联取消
        setDrawer(false);
        setDrawerMeta(`${actionStepCount} 步 · 已手动停止`);
        document.getElementById('resultArea').appendChild(createNoticeCard('⏹ 已手动停止，部分中间结果可在思考抽屉查看'));
      } else {
        setDrawer(false);
        setDrawerMeta('已中断');
        document.getElementById('resultArea').appendChild(createErrorCard(`请求失败: ${err.message}`));
      }
      setStatus('', false);
    } finally {
      setSendEnabled(true);
    }
  }

  // 抽屉头点击：展开 / 收起
  document.getElementById('thinkHeader').addEventListener('click', () => {
    const drawer = document.getElementById('thinkDrawer');
    setDrawer(!drawer.classList.contains('open'));
  });

  // 回车发送（Shift+Enter 换行）
  document.getElementById('question').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendQuery(); }
  });
</script>
</body>
</html>
